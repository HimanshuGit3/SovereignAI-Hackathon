<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SovereignAI Workbench</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --line:#30363d; --ink:#e6edf3;
  --dim:#8b949e; --accent:#2f81f7; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
  --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:16px;font-weight:600;letter-spacing:.2px}
h1 span{color:var(--accent)}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim);font-family:var(--mono)}
.pill.ok{color:var(--ok);border-color:#1f6f33}
.pill.bad{color:var(--bad);border-color:#7a2420}
.spacer{flex:1}
main{flex:1;display:grid;grid-template-columns:280px 1fr 340px;overflow:hidden}
aside,section{overflow-y:auto;padding:16px}
aside{background:var(--panel);border-right:1px solid var(--line)}
.right{background:var(--panel);border-right:0;border-left:1px solid var(--line)}
h2{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin:18px 0 8px}
h2:first-child{margin-top:0}
.model{padding:7px 9px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;font-size:12px}
.model .n{font-family:var(--mono);color:var(--accent)}
.model .r{color:var(--dim);font-size:11px}
.model.live{border-color:var(--ok)}
.file{padding:6px 9px;border-radius:5px;font-size:12px;font-family:var(--mono);cursor:pointer;color:var(--dim);display:flex;justify-content:space-between}
.file:hover{background:#1f2630;color:var(--ink)}
.file a{color:var(--accent);text-decoration:none}
#composer{display:flex;gap:8px;margin-bottom:14px}
textarea{flex:1;background:#0d1117;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:11px;font:13px/1.5 system-ui;resize:vertical;min-height:74px}
textarea:focus{outline:0;border-color:var(--accent)}
button{background:var(--accent);border:0;border-radius:8px;color:#fff;padding:0 20px;font-weight:600;cursor:pointer;font-size:13px}
button:disabled{background:#30363d;color:var(--dim);cursor:not-allowed}
.chip{display:inline-block;background:#1f2630;border:1px solid var(--line);border-radius:6px;padding:5px 10px;margin:0 6px 6px 0;font-size:12px;cursor:pointer;color:var(--dim)}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.step{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:10px 12px;margin-bottom:9px;background:#0d1117}
.step.err{border-left-color:var(--bad)}
.step.final{border-left-color:var(--ok)}
.step .hd{display:flex;gap:9px;align-items:center;font-size:12px;margin-bottom:5px}
.step .tool{font-family:var(--mono);color:var(--accent);font-weight:600}
.step .ms{color:var(--dim);font-size:11px;margin-left:auto}
.obs{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:pre-wrap;max-height:130px;overflow:auto;background:#010409;padding:8px;border-radius:4px;margin-top:6px}
.answer{border:1px solid #1f6f33;border-radius:8px;padding:14px;background:#0d1a10;white-space:pre-wrap;margin-top:10px}
.rt{font-family:var(--mono);font-size:11px;color:var(--dim);border:1px dashed var(--line);border-radius:6px;padding:9px;margin-bottom:11px}
.rt b{color:var(--accent)}
.mon{font-family:var(--mono);font-size:11px;white-space:pre-wrap;background:#010409;border:1px solid var(--line);border-radius:6px;padding:10px;max-height:300px;overflow:auto}
.verdict{padding:10px;border-radius:6px;text-align:center;font-weight:700;font-size:13px;margin-bottom:10px}
.verdict.ok{background:#0d1a10;color:var(--ok);border:1px solid #1f6f33}
.verdict.bad{background:#1a0d0d;color:var(--bad);border:1px solid #7a2420}
.art{display:block;padding:8px;border:1px solid var(--ok);border-radius:6px;color:var(--ok);text-decoration:none;font-size:12px;font-family:var(--mono);margin-top:8px}
small{color:var(--dim);font-size:11px}
</style>
</head>
<body>
<header>
  <h1>Sovereign<span>AI</span> Workbench</h1>
  <span class="pill" id="ep">connecting…</span>
  <span class="pill" id="sbx">sandbox ?</span>
  <div class="spacer"></div>
  <span class="pill ok" id="sov">EGRESS 0 EXTERNAL</span>
</header>

<main>
<aside>
  <h2>Models</h2><div id="models"></div>
  <h2>Samples</h2><div id="samples"></div>
  <h2>Outputs</h2><div id="outputs"></div>
</aside>

<section>
  <div id="composer">
    <textarea id="task" placeholder="Describe the task…"></textarea>
    <button id="go">Run</button>
  </div>
  <div id="presets"></div>
  <div id="trace"></div>
</section>

<aside class="right">
  <h2>Sovereignty Monitor</h2>
  <div class="verdict ok" id="verdict">NO EXTERNAL CALLS</div>
  <div class="mon" id="egress">idle</div>
  <h2>Run Summary</h2>
  <div class="mon" id="summary">no run yet</div>
</aside>
</main>

<script>
const API = "";
const $ = id => document.getElementById(id);

const PRESETS = [
  ["Approval note (flagship)", "Read data/samples/inspection_report.png, extract the key findings and draft a formal approval note as a Word document called approval_note.docx"],
  ["P&ID vision", "Read data/samples/pid_extract.png and list every equipment tag with what it represents"],
  ["Verified calculation", "A pump moves 0.028 m3/s of crude at density 850 kg/m3 against 45 m head at 72 percent efficiency. Calculate the shaft power and show the working."],
  ["NPSH check", "Calculate NPSH available: suction pressure 1.8 bar absolute, vapour pressure 0.35 bar, density 850 kg/m3, static head 3.2 m, friction losses 0.9 m"],
  ["Sandboxed code", "Write and run Python that computes the first 12 Fibonacci numbers"],
  ["List files", "What files are available in data/samples?"]
];

PRESETS.forEach(([label, text]) => {
  const c = document.createElement("span");
  c.className = "chip"; c.textContent = label;
  c.onclick = () => { $("task").value = text; };
  $("presets").appendChild(c);
});

async function health(){
  try{
    const h = await (await fetch(API+"/api/health")).json();
    $("ep").textContent = h.inference_endpoint;
    $("ep").className = "pill " + (h.inference_reachable ? "ok" : "bad");
    $("sbx").textContent = h.sandbox_available ? "sandbox ready" : "no sandbox";
    $("sbx").className = "pill " + (h.sandbox_available ? "ok" : "bad");
  }catch(e){ $("ep").textContent = "API unreachable"; $("ep").className="pill bad"; }
}

async function models(){
  const d = await (await fetch(API+"/api/models")).json();
  $("models").innerHTML = d.models.map(m => `
    <div class="model ${m.resident ? "live" : ""}">
      <div class="n">${m.name}</div>
      <div class="r">${m.role}${m.resident ? " &middot; in VRAM "+m.vram_gb+" GB" : ""}</div>
    </div>`).join("");
}

async function files(){
  const d = await (await fetch(API+"/api/files")).json();
  $("samples").innerHTML = d.samples.map(f =>
    `<div class="file" onclick="pick('${f.path}')"><span>${f.name}</span></div>`).join("")
    || "<small>none</small>";
  $("outputs").innerHTML = d.outputs.slice(-8).reverse().map(f =>
    `<div class="file"><a href="${API}/api/download/${f.name}">${f.name}</a>
     <span>${(f.size/1024).toFixed(0)}k</span></div>`).join("")
    || "<small>none yet</small>";
}

function pick(p){ $("task").value = "Read " + p + " and summarise the key findings"; }

async function egress(){
  const d = await (await fetch(API+"/api/monitor/egress")).json();
  const bad = d.external_count > 0;
  $("sov").textContent = `EGRESS ${d.external_count} EXTERNAL`;
  $("sov").className = "pill " + (bad ? "bad" : "ok");
  $("verdict").textContent = bad ? "EXTERNAL CALLS DETECTED" : "NO EXTERNAL CALLS";
  $("verdict").className = "verdict " + (bad ? "bad" : "ok");
  $("egress").textContent =
    `requests   ${d.total_requests}\nprivate    ${d.by_classification.PRIVATE}\n` +
    `loopback   ${d.by_classification.LOCAL}\nEXTERNAL   ${d.external_count}\n\n` +
    d.destinations.map(x => "  " + x).join("\n");
}

function esc(s){ return (s||"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

$("go").onclick = async () => {
  const task = $("task").value.trim();
  if(!task) return;
  $("go").disabled = true;
  $("trace").innerHTML = "";
  $("summary").textContent = "running…";

  const res = await fetch(API+"/api/task/stream", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({task, attachments: []})
  });

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "";

  while(true){
    const {value, done} = await reader.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    const parts = buf.split("\n\n");
    buf = parts.pop();
    for(const p of parts){
      if(!p.startsWith("data: ")) continue;
      let ev; try{ ev = JSON.parse(p.slice(6)); }catch(e){ continue; }
      render(ev);
    }
  }
  $("go").disabled = false;
  egress(); models(); files();
};

function render(ev){
  const t = $("trace");
  if(ev.type === "routing"){
    t.insertAdjacentHTML("beforeend",
      `<div class="rt">ROUTER &rarr; <b>${ev.task_type}</b> &middot; model <b>${ev.model_name}</b>
       &middot; ${ev.method} in ${ev.routing_latency_ms} ms<br>${esc(ev.reason)}</div>`);
  }
  else if(ev.type === "step" && ev.kind === "tool"){
    t.insertAdjacentHTML("beforeend",
      `<div class="step ${ev.ok ? "" : "err"}">
        <div class="hd"><span>${ev.n}</span><span class="tool">${ev.tool}</span>
        <span>${ev.ok ? "ok" : "error"}</span><span class="ms">${ev.elapsed_ms} ms</span></div>
        <div class="obs">${esc(JSON.stringify(ev.arguments).slice(0,300))}</div>
        <div class="obs">${esc(ev.observation)}</div></div>`);
  }
  else if(ev.type === "step" && ev.kind === "final"){
    t.insertAdjacentHTML("beforeend", `<div class="answer">${esc(ev.content)}</div>`);
  }
  else if(ev.type === "done"){
    $("summary").textContent =
      `steps       ${ev.steps}\ntools       ${ev.tool_calls.join(", ")}\n` +
      `orchestr.   ${ev.orchestrator_model}\ndelegates   ${(ev.delegate_models||[]).join(", ")||"none"}\n` +
      `offered     ${(ev.tools_offered||[]).length} tools\ntotal       ${ev.total_ms} ms\n` +
      `stopped     ${ev.stopped_reason}`;
    (ev.artifacts||[]).forEach(a => {
      const n = a.split("/").pop();
      $("trace").insertAdjacentHTML("beforeend",
        `<a class="art" href="${API}/api/download/${n}" download>Download ${n}</a>`);
    });
  }
  else if(ev.type === "error"){
    t.insertAdjacentHTML("beforeend", `<div class="step err"><div class="obs">${esc(ev.error)}</div></div>`);
  }
  t.scrollTop = t.scrollHeight;
}

health(); models(); files(); egress();
setInterval(egress, 6000);
</script>
</body>
</html>
